# BeaconNet nodes. Copy to inventory.ini (which git ignores) and fill in your Pi(s).
# The sudo password isn't stored here: run the playbook with -K.
[bbs_nodes]
my-bbs-node ansible_host=192.0.2.10 ansible_user=pi bbs_node_id=BEACON-EXAMPLE-01

[bbs_nodes:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_remote_tmp=~/.ansible/tmp
