# Build BeaconNet Desktop for Windows (.exe), macOS (.app) and Linux, and attach the
# downloads to the GitHub release when a v* tag is pushed. Run it by hand
# (Actions > desktop > Run workflow) to get test builds as workflow artifacts.
name: desktop

on:
  push:
    tags: ["v*"]
    branches: ["desktop-*"]      # test builds, downloadable as workflow artifacts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: BeaconNet-Windows.zip
          - os: macos-latest
            asset: BeaconNet-macOS.zip
          - os: ubuntu-22.04
            asset: BeaconNet-Linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}   # empty until SignPath is set up
    defaults:
      run:
        shell: bash
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Icons and version info
        run: python make_icons.py . && python make_version_info.py .
      - name: Build
        run: |
          SEP=":"; [[ "$RUNNER_OS" == "Windows" ]] && SEP=";"
          ICON=icon.png
          [[ "$RUNNER_OS" == "Windows" ]] && ICON=icon.ico
          [[ "$RUNNER_OS" == "macOS" ]] && ICON=icon.icns
          MODE=--onefile; [[ "$RUNNER_OS" == "macOS" ]] && MODE=--onedir   # a normal .app bundle on macOS
          VER=""; [[ "$RUNNER_OS" == "Windows" ]] && VER="--version-file version_info.txt"
          python -m PyInstaller --noconfirm --clean $MODE --windowed --name BeaconNet $VER \
            --icon "$ICON" --add-data "ui.html${SEP}." \
            --hidden-import pystray._win32 --hidden-import pystray._darwin \
            --hidden-import pystray._appindicator --hidden-import pystray._gtk --hidden-import pystray._xorg \
            --osx-bundle-identifier org.beaconnet.desktop \
            beaconnet_desktop.py
      - name: Smoke test (starts, serves its page, stops)
        if: runner.os != 'macOS'
        run: |
          BIN=dist/BeaconNet; [[ "$RUNNER_OS" == "Windows" ]] && BIN=dist/BeaconNet.exe
          export BEACONNET_HOME="$RUNNER_TEMP/bn"
          # Started the way "Update now" starts the new copy (waits for the port, tidies up).
          "$BIN" --no-browser --no-tray --port 8799 --after-update 1 &
          PID=$!
          for i in $(seq 30); do curl -sf -o page.html -H "Host: 127.0.0.1:8799" http://127.0.0.1:8799/ && break; sleep 1; done
          grep -q BEACONNET page.html
          if [[ "$RUNNER_OS" == "Windows" ]]; then taskkill //F //IM BeaconNet.exe || true; else kill $PID || true; fi
      - name: Smoke test (macOS app bundle)
        if: runner.os == 'macOS'
        run: |
          export BEACONNET_HOME="$RUNNER_TEMP/bn"
          dist/BeaconNet.app/Contents/MacOS/BeaconNet --no-browser --no-tray --port 8799 &
          PID=$!
          for i in $(seq 30); do curl -sf -o page.html http://127.0.0.1:8799/ && break; sleep 1; done
          grep -q BEACONNET page.html
          kill $PID || true
      # --- Windows code signing (SignPath Foundation; see CODE_SIGNING.md) ------------
      # Runs only once the project is set up in SignPath: repository secret
      # SIGNPATH_API_TOKEN and variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG.
      # Releases use the 'release-signing' policy (a maintainer approves each one);
      # other builds use 'test-signing'.
      - name: Upload unsigned exe for signing
        id: unsigned
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: BeaconNet-unsigned-exe
          path: clients/desktop/dist/BeaconNet.exe
      - name: Sign with SignPath
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: clients/desktop/dist
      - name: Check the signature
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist/BeaconNet.exe
          "Signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { exit 1 }
      - name: Package
        run: |
          cp README.md dist/README.md
          cd dist
          case "$RUNNER_OS" in
            Windows) 7z a "../${{ matrix.asset }}" BeaconNet.exe README.md >/dev/null ;;
            macOS)   ditto -c -k --keepParent BeaconNet.app "../${{ matrix.asset }}" ;;
            Linux)   tar czf "../${{ matrix.asset }}" BeaconNet README.md ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: clients/desktop/${{ matrix.asset }}
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release is created by hand right after the tag is pushed; wait for it.
          for i in $(seq 40); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 15; done
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber

  # Last, and only if all three builds made it: BeaconNet-version.txt tells installed apps
  # that this release's downloads are ready (the app's update check reads it).
  version-file:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Attach BeaconNet-SHA256SUMS.txt
        # "Update now" in the app installs a download only if it matches this list.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dl
          gh release download "$GITHUB_REF_NAME" -D dl -p 'BeaconNet-*.zip' -p 'BeaconNet-*.tar.gz'
          [[ $(ls dl | wc -l) -eq 3 ]] || { echo "expected 3 downloads"; ls dl; exit 1; }
          (cd dl && sha256sum BeaconNet-*) > BeaconNet-SHA256SUMS.txt
          cat BeaconNet-SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" BeaconNet-SHA256SUMS.txt --clobber
      - name: Attach BeaconNet-version.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^VERSION = "\([0-9.]*\)"$/\1/p' clients/desktop/beaconnet_desktop.py)
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "can't read the app version"; exit 1; }
          printf '%s\n' "$v" > BeaconNet-version.txt
          gh release upload "$GITHUB_REF_NAME" BeaconNet-version.txt --clobber
          echo "BeaconNet Desktop $v"
