name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -q --no-deps \
            -r services/bbs-core/requirements.lock -r services/bbs-ssh/requirements.lock
          python -m pip install --disable-pip-version-check -q -r tests/requirements.txt
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Compose file validates
        run: |
          cp .env.example .env
          mkdir -p secrets config state && for s in ssh_gateway_token admin_gateway_token sync_gateway_token \
            ssh_host_ed25519_key ssh_host_rsa_key admin_host_ed25519_key node_ed25519_key; do touch secrets/$s; done
          docker compose config --quiet
